<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nazo is watching u</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #312e81);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        h1 {
            text-align: center;
            color: #111827;
            margin: 0 0 10px;
            font-size: 28px;
        }

        .description {
            text-align: center;
            color: #6b7280;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            height: 52px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 0 15px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            height: 55px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-family: inherit;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .warning {
            margin-top: 20px;
            padding: 13px;
            border-radius: 10px;
            background: #fff7ed;
            color: #9a3412;
            font-size: 13px;
            line-height: 1.8;
            text-align: center;
        }

        .error {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 10px;
            background: #fef2f2;
            color: #b91c1c;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 25px 20px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            📝
        </div>

        <h1>
            Nazo is watching u
        </h1>

        <p class="description">
            اسم و کدت دزست بزن.
        </p>

        <div id="error" class="error"></div>

        <div class="form-group">

            <label for="name">
                اسمت عامو
            </label>

            <input
                type="text"
                id="name"
                placeholder="مثلاً علی"
                autocomplete="name"
            >

        </div>

        <div class="form-group">

            <label for="code">
                سایز شورتت
            </label>

            <input
                type="text"
                id="code"
                placeholder="مثلاً 3"
                autocomplete="off"
            >

        </div>

        <button onclick="startExam()">
            شروع آزمون
        </button>

        <div class="warning">
            ⚠️ قبل از شروع آزمون، از اتصال اینترنت خود مطمئن شوید
            قاین شت.
        </div>

    </div>

</div>

<script>

function startExam() {

    const name =
        document.getElementById("name").value.trim();

    const code =
        document.getElementById("code").value.trim();

    const error =
        document.getElementById("error");


    if (name === "") {

        error.textContent =
            "اسمتم بزن عامو.";

        error.style.display = "block";

        return;
    }


    if (code === "") {

        error.textContent =
            "سایزت شورتتون جناب.";

        error.style.display = "block";

        return;
    }


    localStorage.setItem(
        "candidateName",
        name
    );

    localStorage.setItem(
        "candidateCode",
        code
    );

    if (typeof window.startExamApplication === "function") {

        window.startExamApplication();

        return;
    }

    window.location.href = "exam.html";
}

</script>

</body>
</html>
